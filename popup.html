<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <div id="status">Checking URL...</div>

  <div id="setup-form" class="hidden">
    <label for="url"><strong>Current URL:</strong></label>
    <input type="text" id="url" placeholder="e.g., example\.com/page/1" readonly>

    <label for="pattern" style="margin-top: 8px; display: block;"><strong>New Regex Pattern:</strong></label>
    <input type="text" id="pattern" placeholder="e.g., example\.com/page/\d+">

    <button id="save-btn">Save Pattern & Update Bookmark</button>
  </div>

  <hr>

  <h3>Saved Patterns</h3>
  <ul id="pattern-list"></ul>
  <p id="version-marker">v0.2.2</p>

  <script src="quickmark.js"></script>
</body>
</html>
